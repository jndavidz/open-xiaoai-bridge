services:
  open-xiaoai-bridge:
    image: open-xiaoai-bridge:home      # 路径A：镜像由 WSL 侧 docker build -t :home → save tar → scp → NAS docker load 提供；compose 仅引用,不在此构建
    container_name: open-xiaoai-bridge
    restart: unless-stopped
    # host 网络：4399/9092 直接监听群晖宿主，音箱与 HA 均可直达，无需端口映射
    network_mode: host
    environment:
      - LOGLEVEL=INFO
      - API_SERVER_ENABLE=1
      - API_SERVER_HOST=0.0.0.0   # 必须，否则 HA 访问不到 :9092
      - OPENAI_ENABLE=1           # 仅启用 OpenAI 兼容后端（DeepSeek 等任意兼容服务，面板内可自由更换）
      # 后台面板（http://<nas>:9092/admin）访问令牌，必填；写操作与配置修改全靠它鉴权
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # aurora 网关鉴权（A3，可选）：config.py AURORA_API_KEY 的 env 注入；
      # 未设置时回落 config.py 兜底默认值
      - AURORA_API_KEY=${AURORA_API_KEY:-david}
      # 业务 API 鉴权（必填）：写类端点要求 Authorization: Bearer；留空则写类端点 503 失败关闭
      - BRIDGE_API_TOKEN=${BRIDGE_API_TOKEN}
      # 具名 token 集合（票 12，可选）：label:token 逗号分隔；与上面并存时旧值 = label legacy
      - BRIDGE_API_TOKENS=${BRIDGE_API_TOKENS:-}
      # PC 语音注入（可选）：留空=关闭；1/true/yes/on=开启（监听 :9093）
      - INJECT_ENABLE=${INJECT_ENABLE:-}
      # 9093 数据面鉴权（票 12）：启用注入后未配 CIDR 且未显式 INJECT_ALLOW_ANON=1 ⇒ 拒绝监听 9093
      - INJECT_ALLOW_CIDR=${INJECT_ALLOW_CIDR:-}
      - INJECT_ALLOW_ANON=${INJECT_ALLOW_ANON:-}
      # 每轮延迟埋点（可选）：留空=关闭；1/true/yes/on=开启（每轮一条 [TurnTrace] 数值行）
      - TURN_TRACE_ENABLED=${TURN_TRACE_ENABLED:-}
      # 面板「外部服务」探测列表（JSON 数组，可选）；纯状态监控，与对话后端无关，留空不展示
      - MONITOR_SERVICES=${MONITOR_SERVICES}
      - RUNTIME_OVERRIDES_PATH=/app/data/runtime-overrides.json
      # AI 对话后端「一键切换」预设库（按钮配置）；与覆盖层分离，同挂 ./data 卷持久化
      - BACKEND_PRESETS_PATH=/app/data/backend-presets.json
      # 以下从 .env 读取（.env 不入库）
      - OPEN_XIAOAI_TOKEN=${OPEN_XIAOAI_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HA_TOKEN=${HA_TOKEN}
      - HA_BASE_URL=${HA_BASE_URL:-http://10.10.10.2:8123}
    volumes:
      - ./config.py:/app/config.py        # 热重载：改完约 1 秒生效
      - ./models:/app/core/models         # VAD + KWS 模型（xiaoai_asr 模式不需要 ASR 大模型）
      - ./data:/app/data                  # 面板运行时覆盖层（runtime-overrides.json）+ 后端预设库（backend-presets.json）持久化
      # LX06 私钥只读挂载（P0.5 票 01）：仅 native 事件源拉流用；密钥绝不烤进镜像层。
      # 目录内 = id_rsa + known_hosts（LX06 行单独成档）；挂了不用（native_cmd 留空）无任何行为变化。
      - /var/services/homes/zxsadmin/.ssh/lx06-ir:/app/keys/lx06-ir:ro
    stdin_open: true
    tty: true
