# ===== xiaomusic 播控（实现层可替换：改这里即可切换 MA/LMS）=====
music_stop:
  alias: 音乐·停止
  sequence:
    - service: rest_command.xiaomusic_cmd
      data:
        did: "566642283"
        cmd: "停止播放"
music_play_random:
  alias: 音乐·随机播放
  sequence:
    - service: rest_command.xiaomusic_cmd
      data:
        did: "566642283"
        cmd: "点歌 随机播放"
music_next:
  alias: 音乐·下一首
  sequence:
    - service: rest_command.xiaomusic_cmd
      data:
        did: "566642283"
        cmd: "下一首"
music_prev:
  alias: 音乐·上一首
  sequence:
    - service: rest_command.xiaomusic_cmd
      data:
        did: "566642283"
        cmd: "上一首"
music_vol_up:
  alias: 音乐·音量加
  sequence:
    - service: rest_command.xiaomusic_setvol
      data:
        volume: "{{ (states('sensor.xiaomusic_volume') | int(0)) + 10 }}"
music_vol_down:
  alias: 音乐·音量减
  sequence:
    - service: rest_command.xiaomusic_setvol
      data:
        volume: "{{ (states('sensor.xiaomusic_volume') | int(0)) - 10 }}"
