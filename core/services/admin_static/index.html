<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桥接控制台 · open-xiaoai</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d3748;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  header .dot.ok { background: var(--ok); }
  header .spacer { flex: 1; }
  header .meta { color: var(--muted); font-size: .8rem; }
  nav { display: flex; gap: 4px; padding: 8px 14px 0; background: var(--panel); }
  nav button { background: none; border: none; color: var(--muted); padding: 8px 16px;
               font-size: .95rem; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 14px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 10px; font-size: .92rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: .85rem; }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v { text-align: right; word-break: break-all; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .75rem; }
  .pill.ok   { background: rgba(63,185,80,.15);  color: var(--ok); }
  .pill.bad  { background: rgba(248,81,73,.15);  color: var(--err); }
  .pill.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .pill.off  { background: rgba(139,148,158,.15); color: var(--muted); }
  /* 日志 */
  #logbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #logbox { background: #0a0d12; border: 1px solid var(--border); border-radius: 8px;
            height: calc(100vh - 220px); min-height: 300px; overflow-y: auto;
            font-family: Consolas, "JetBrains Mono", monospace; font-size: .78rem;
            padding: 8px 10px; line-height: 1.5; }
  .lg { white-space: pre-wrap; word-break: break-all; }
  .lg .t { color: #55606e; }
  .lg.ERROR, .lg.CRITICAL { color: var(--err); }
  .lg.WARNING { color: var(--warn); }
  .lg.DEBUG { color: #6e7681; }
  .lg.INFO { color: #c9d1d9; }
  /* 设置 */
  section.cfg { background: var(--panel); border: 1px solid var(--border);
                border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  section.cfg h2 { margin: 0 0 4px; font-size: 1rem; }
  section.cfg p.desc { margin: 0 0 14px; color: var(--muted); font-size: .82rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; max-width: 480px; background: var(--panel2);
      border: 1px solid var(--border); color: var(--text); border-radius: 6px;
      padding: 7px 10px; font-size: .9rem; }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field .help { font-size: .75rem; color: var(--muted); margin-top: 3px; }
  .field .tag { font-size: .7rem; margin-left: 6px; padding: 0 6px; border-radius: 8px; }
  .tag.override { background: rgba(88,166,255,.15); color: var(--accent); }
  .btnrow { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  button.act { background: var(--accent); color: #04121f; border: none; border-radius: 6px;
               padding: 8px 16px; font-size: .88rem; cursor: pointer; font-weight: 600; }
  button.act.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
  button.act.danger { background: transparent; color: var(--err); border: 1px solid var(--err); font-weight: 400; }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--panel2); border: 1px solid var(--border); color: var(--text);
           padding: 10px 20px; border-radius: 8px; font-size: .88rem; display: none; z-index: 99;
           box-shadow: 0 4px 16px rgba(0,0,0,.5); max-width: 90vw; }
  select#lvl { width: auto; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 10px; padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog input { width: 100%; background: var(--panel2); border: 1px solid var(--border);
                 color: var(--text); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  /* 预设条：一键切换 */
  .pbar { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px;
          padding: 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
  .pbar-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pbar-head .title { font-size: .85rem; color: var(--muted); margin-right: auto; }
  .plist { display: flex; flex-wrap: wrap; gap: 8px; }
  .pitem { position: relative; display: inline-flex; align-items: center; gap: 6px;
           padding: 7px 12px; border-radius: 18px; cursor: pointer; user-select: none;
           background: var(--panel); border: 1px solid var(--border); color: var(--text);
           font-size: .88rem; transition: border-color .12s, background .12s; }
  .pitem:hover { border-color: var(--muted); }
  .pitem .nm { font-weight: 600; }
  .pitem .mdl { font-size: .72rem; color: var(--muted); }
  .pitem.active { border-color: var(--accent); background: rgba(88,166,255,.12); }
  .pitem.active::after { content: "●"; color: var(--accent); font-size: .7rem; }
  .pitem.disabled { cursor: progress; opacity: .6; }
  .pitem .x { margin-left: 2px; color: var(--muted); font-size: .95rem; line-height: 1;
              padding: 0 2px; border-radius: 50%; }
  .pitem .x:hover { color: var(--err); }
  .pitem .bm { font-size: .72rem; color: var(--ok); font-variant-numeric: tabular-nums; }
  .pitem .bm.bad { color: var(--err); }
  .pitem .psel { margin: 0 2px 0 0; accent-color: var(--accent); cursor: pointer; }
  .pempty { color: var(--muted); font-size: .82rem; }
  /* 测速结果 */
  #benchWrap { margin-top: 10px; }
  #benchWrap table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  #benchWrap th, #benchWrap td { text-align: left; padding: 5px 8px;
      border-bottom: 1px solid var(--border); }
  #benchWrap th { color: var(--muted); font-weight: 500; }
  #benchWrap td.num, #benchWrap th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #benchWrap tr.best td { color: var(--ok); }
  #benchWrap .pv { color: var(--muted); font-size: .74rem; }
  /* 预设编辑弹窗 */
  #presetDlg { min-width: min(460px, 92vw); }
  #presetDlg .dfield { margin-top: 10px; }
  #presetDlg .dfield label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 3px; }
  #presetDlg .dfield input, #presetDlg .dfield select {
      width: 100%; background: var(--panel2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: .9rem; }
  #presetDlg .dfield .help { font-size: .73rem; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="hdot"></span>
  <h1>桥接控制台</h1>
  <span class="meta" id="hmeta"></span>
  <div class="spacer"></div>
  <span class="meta" id="huptime"></span>
  <button class="act sec" id="tokenBtn" style="padding:5px 12px">🔑 Token</button>
</header>

<nav>
  <button data-tab="overview" class="active">总览</button>
  <button data-tab="logs">日志</button>
  <button data-tab="settings">设置</button>
</nav>

<main>
  <div id="tab-overview">
    <div class="grid" id="ov-grid"><div class="card">加载中…</div></div>
  </div>

  <div id="tab-logs" style="display:none">
    <div id="logbar">
      <select id="logFilter" class="field" style="width:auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;">
        <option value="ALL">全部级别</option>
        <option value="INFO">INFO+</option>
        <option value="WARNING">WARNING+</option>
        <option value="ERROR">ERROR+</option>
      </select>
      <label style="font-size:.85rem;color:var(--muted)"><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
      <label style="font-size:.85rem;color:var(--muted)"><input type="checkbox" id="pausePoll"> 暂停刷新</label>
      <span class="meta" style="margin-left:auto;color:var(--muted);font-size:.78rem" id="logstat"></span>
    </div>
    <div id="logbox"></div>
  </div>

  <div id="tab-settings" style="display:none">
    <section class="cfg">
      <h2>AI 对话后端</h2>
      <p class="desc">预设按钮一键切换（写入覆盖层即热生效）；测速对比各候选的响应与生成速度。</p>
      <div class="pbar">
        <div class="pbar-head">
          <span class="title">一键切换</span>
          <select id="benchRounds" title="发起的请求数：首轮作预热（含建连/冷启动）不计入统计，其余轮取平均" style="background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.8rem">
            <option value="1">1 轮（不预热）</option>
            <option value="2">2 轮</option>
            <option value="3" selected>3 轮</option>
            <option value="5">5 轮</option>
          </select>
          <button class="act sec" id="benchBtn" style="padding:6px 14px">⚡ 测速</button>
          <button class="act sec" id="presetAdd" style="padding:6px 14px">＋ 空白模板</button>
        </div>
        <div class="pbar-head" id="benchOpts">
          <label style="font-size:.8rem;color:var(--muted)">测速范围
            <select id="benchScope" style="background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:.8rem">
              <option value="all">全部预设</option>
              <option value="selected">仅勾选</option>
            </select>
          </label>
          <label style="font-size:.8rem;color:var(--muted)">生成上限
            <input id="benchTokens" type="number" min="16" max="2048" step="16" value="300"
                   style="width:84px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:.8rem">
          </label>
          <label style="font-size:.8rem;color:var(--muted);flex:1;min-width:200px">提示词
            <input id="benchPrompt" value="用三句话介绍你自己，并说明你能帮我做什么。"
                   style="width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:.8rem">
          </label>
        </div>
        <div class="plist" id="presetList"></div>
        <div id="benchWrap"></div>
      </div>
    </section>
    <section class="cfg">
      <h2>运行时</h2>
      <p class="desc">日志级别立即生效（仅运行期，重启后回到 LOGLEVEL 环境变量值）。</p>
      <div class="field">
        <label>日志级别</label>
        <select id="lvl">
          <option>DEBUG</option><option>INFO</option><option>WARNING</option><option>ERROR</option>
        </select>
      </div>
      <div class="btnrow"><button class="act sec" id="lvlApply">应用日志级别</button></div>
    </section>
    <div id="cfgSections"></div>
  </div>
</main>

<div id="toast"></div>

<dialog id="tokdlg">
  <h3 style="margin:0 0 6px">面板访问令牌</h3>
  <p style="color:var(--muted);font-size:.85rem;margin:0">即容器环境变量 ADMIN_TOKEN（.env 中配置）。仅保存在本机浏览器。</p>
  <input type="password" id="tokInput" placeholder="ADMIN_TOKEN">
  <div class="btnrow" style="margin-top:14px">
    <button class="act" id="tokSave">保存并连接</button>
  </div>
</dialog>

<dialog id="presetDlg">
  <h3 style="margin:0 0 4px" id="presetDlgTitle">新增预设</h3>
  <p style="color:var(--muted);font-size:.8rem;margin:0" id="presetDlgHint">
    预设只是「候选按钮」，点它才会切换生效；新增/删除不影响当前配置。
  </p>
  <div class="dfield"><label>名称（按钮文字）</label><input id="pf_name" placeholder="如 DeepSeek"></div>
  <div class="dfield"><label>接口地址 Base URL</label><input id="pf_base_url" placeholder="https://api.deepseek.com/v1"></div>
  <div class="dfield">
    <label>接口规格</label>
    <select id="pf_api_style">
      <option value="chat_completions">OpenAI Chat Completions（默认）</option>
      <option value="openai_responses">OpenAI Responses</option>
      <option value="anthropic_messages">Anthropic Messages</option>
    </select>
  </div>
  <div class="dfield"><label>模型名称 Model</label><input id="pf_model" placeholder="deepseek-chat"></div>
  <div class="dfield">
    <label>API Key</label>
    <input id="pf_api_key" type="password" autocomplete="new-password" placeholder="留空 = 不修改">
    <div class="help" id="pf_key_help">本地 ollama / LM Studio 等无需鉴权的服务可留空。</div>
  </div>
  <div class="btnrow" style="margin-top:16px">
    <button class="act" id="pfSave">保存</button>
    <button class="act sec" id="pfCancel">取消</button>
    <button class="act sec" id="pfTest">🔌 测试连接</button>
  </div>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TOKEN_KEY = "ox_admin_token";
let token = localStorage.getItem(TOKEN_KEY) || "";

function toast(msg, ms = 2600) {
  const el = $("#toast"); el.textContent = msg; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", ms);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(opts.headers || {}) },
  });
  if (res.status === 401 || res.status === 503) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || (res.status === 401 ? "令牌无效" : "服务端未配置 ADMIN_TOKEN"));
  }
  const body = await res.json().catch(() => ({ success: false, error: "bad response" }));
  if (!body.success) throw new Error(body.error || "unknown error");
  return body.data;
}

/* ---------------- tabs ---------------- */
document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  ["overview", "logs", "settings"].forEach(t =>
    $("#tab-" + t).style.display = t === btn.dataset.tab ? "" : "none");
}));

/* ---------------- token ---------------- */
function needToken(msg) { $("#tokdlg").showModal(); if (msg) toast(msg); }
$("#tokenBtn").addEventListener("click", () => { $("#tokInput").value = ""; $("#tokdlg").showModal(); });
$("#tokSave").addEventListener("click", () => {
  token = $("#tokInput").value.trim();
  if (!token) return toast("请输入令牌");
  localStorage.setItem(TOKEN_KEY, token);
  $("#tokdlg").close();
  refreshOverview(); refreshConfigSchema();
});
if (!token) needToken();

/* ---------------- overview ---------------- */
const fmtDur = s => {
  if (s == null) return "-";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + "天" : "") + (h ? h + "时" : "") + m + "分";
};
const esc = s => String(s ?? "-").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = (cond, okText, badText, cls = "") =>
  `<span class="pill ${cls || (cond ? "ok" : "off")}">${cond ? okText : badText}</span>`;

function backendCard(name, icon, b, extraRows = []) {
  const stateCls = !b.enabled ? "off" : b.connected ? "ok" : "warn";
  const stateTxt = !b.enabled ? "未启用" : b.connected ? "已连接" : "已启用·未连接";
  return `<div class="card"><h3>${icon} ${name} ${pill(true, stateTxt, stateTxt, stateCls)}</h3>
    ${extraRows.map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}
    ${b.last_error ? `<div class="kv"><span class="k">最近错误</span><span class="v" style="color:var(--err)">${esc(b.last_error).slice(0, 120)}</span></div>` : ""}
  </div>`;
}

function renderOverview(d) {
  $("#hdot").classList.add("ok");
  $("#huptime").textContent = "已运行 " + fmtDur(d.runtime?.uptime_s);
  const cards = [];

  cards.push(`<div class="card"><h3>🌉 Bridge 服务 ${pill(d.app.running, "运行中", "异常", d.app.running ? "ok" : "bad")}</h3>
    <div class="kv"><span class="k">设备状态</span><span class="v">${esc(d.app.device_state)}</span></div>
    <div class="kv"><span class="k">配置文件</span><span class="v" style="font-size:.75rem">${esc(d.runtime.config_path)}</span></div>
    <div class="kv"><span class="k">覆盖项</span><span class="v">${d.runtime.overrides_keys ?? 0} 项 · <span style="font-size:.72rem">${esc(d.runtime.overrides_path)}</span></span></div>
    <div class="kv"><span class="k">日志级别</span><span class="v">${esc(d.runtime.log_level)}</span></div>
  </div>`);

  cards.push(`<div class="card"><h3>🔊 小爱音箱 ${pill(d.speaker.ready, "就绪", "未接入", d.speaker.ready ? "ok" : "bad")}</h3>
    <div class="kv"><span class="k">播放状态</span><span class="v">${esc(d.speaker.playing)}</span></div>
    <div class="kv"><span class="k">小智链路</span><span class="v">${d.backends.xiaozhi.enabled ? pill(d.backends.xiaozhi.connected, "已连接", "未连接", d.backends.xiaozhi.connected ? "ok" : "warn") : pill(false, "", "未启用")}</span></div>
  </div>`);

  const o = d.backends.openai;
  cards.push(backendCard("AI 对话后端", "🤖", o, [
    ["接口地址", esc(o.base_url)],
    ["接口规格", esc(o.api_style)],
    ["模型名称", esc(o.model)],
    ["API Key", o.has_key ? pill(true, "已配置", "", "ok") : pill(false, "", "未配置", "bad")],
    ["会话", esc(o.session_key)],
  ]));

  cards.push(backendCard("OpenClaw 网关", "🦞", d.backends.openclaw,
    d.backends.openclaw.url ? [["地址", esc(d.backends.openclaw.url)]] : []));
  cards.push(backendCard("QwenPaw 工作台", "🐾", d.backends.qwenpaw,
    d.backends.qwenpaw.base_url ? [["地址", esc(d.backends.qwenpaw.base_url)]] : []));

  cards.push(`<div class="card"><h3>🎙️ 音频管线</h3>
    <div class="kv"><span class="k">VAD</span><span class="v">${d.audio.vad_present ? pill(!d.audio.vad_paused, d.audio.vad_paused ? "已暂停" : "检测中", "已暂停", d.audio.vad_paused ? "warn" : "ok") : pill(false, "", "未加载")}</span></div>
    <div class="kv"><span class="k">KWS 唤醒</span><span class="v">${d.audio.kws_present ? pill(true, "已加载", "", "ok") : pill(false, "", "未加载")}</span></div>
    <div class="kv"><span class="k">ASR 模型</span><span class="v">${esc(d.audio.asr_model)}</span></div>
  </div>`);

  for (const svc of (d.external_services || [])) {
    cards.push(`<div class="card"><h3>🛰️ ${esc(svc.name)} ${svc.ok ? pill(true, "在线 " + svc.latency_ms + "ms", "", "ok") : pill(false, "", "离线", "bad")}</h3>
      <div class="kv"><span class="k">探测地址</span><span class="v" style="font-size:.75rem">${esc(svc.url)}</span></div>
      ${svc.status != null ? `<div class="kv"><span class="k">HTTP 状态</span><span class="v">${svc.status}</span></div>` : ""}
      ${svc.error ? `<div class="kv"><span class="k">错误</span><span class="v" style="color:var(--err)">${esc(svc.error).slice(0, 100)}</span></div>` : ""}
    </div>`);
  }

  $("#ov-grid").innerHTML = cards.join("");
}

async function refreshOverview() {
  try {
    const d = await api("/api/admin/overview");
    lastOverview = d;
    renderOverview(d);
    // 裸表单删除后，「生效中」高亮只能依赖 overview 的运行时实际值
    renderPresetBar();
  } catch (e) {
    $("#hdot").classList.remove("ok");
    if (String(e.message).includes("令牌")) needToken(e.message);
    else $("#ov-grid").innerHTML = `<div class="card" style="color:var(--err)">加载失败：${esc(e.message)}</div>`;
  }
}

/* ---------------- logs ---------------- */
const LEVEL_ORDER = { DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50 };
let lastSeq = -1, logLines = [];
const LEVEL_COLORS = {};

async function pollLogs() {
  if ($("#tab-logs").style.display === "none" || $("#pausePoll").checked) return;
  try {
    const d = await api(`/api/admin/logs?after=${lastSeq}&limit=800`);
    if (d.entries.length) {
      lastSeq = d.entries[d.entries.length - 1].seq;
      logLines.push(...d.entries.map(e => ({ ...e, tsStr:
        new Date(e.ts * 1000).toLocaleTimeString("zh-CN", { hour12: false }) + "." + String(Math.floor((e.ts % 1) * 1000)).padStart(3, "0")
      })));
      if (logLines.length > 4000) logLines = logLines.slice(-3000);
      renderLogs();
    }
    $("#logstat").textContent = `缓冲 ${d.latest_seq - d.dropped_total}~${d.latest_seq}${d.dropped_total ? ` · 已丢弃 ${d.dropped_total}` : ""}`;
  } catch (e) { /* 静默，下一轮重试 */ }
}

function renderLogs() {
  const minLevel = LEVEL_ORDER[$("#logFilter").value] ?? 0;
  const box = $("#logbox");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.innerHTML = logLines
    .filter(l => (LEVEL_ORDER[l.level] ?? 0) >= minLevel)
    .map(l => `<div class="lg ${l.level}"><span class="t">${l.tsStr}</span> [${l.level}] ${esc(l.msg)}</div>`)
    .join("");
  if ($("#autoScroll").checked && atBottom) box.scrollTop = box.scrollHeight;
}
$("#logFilter").addEventListener("change", renderLogs);

setInterval(pollLogs, 2000);
setInterval(() => { if ($("#tab-overview").style.display !== "none") refreshOverview(); }, 5000);

/* ---------------- settings ---------------- */
let cfgSchema = [];

async function refreshConfigSchema() {
  try {
    cfgSchema = (await api("/api/admin/config")).schema;
    renderSettings();
    await refreshPresets();
  } catch (e) { if (String(e.message).includes("令牌")) needToken(e.message); }
}

function renderSettings() {
  const host = $("#cfgSections");
  host.innerHTML = "";
  for (const sec of cfgSchema) {
    const el = document.createElement("section");
    el.className = "cfg";
    el.innerHTML = `<h2>${esc(sec.title)}</h2><p class="desc">${esc(sec.description || "")}</p>`;
    for (const f of sec.fields) el.appendChild(renderField(f));
    const row = document.createElement("div");
    row.className = "btnrow";
    // 高级区块的专属动作：清除 openai 覆盖（回落环境变量原始 Key）
    if (sec.id === "openai_advanced") {
      const clrBtn = mkBtn("♻️ 清除地址/规格/模型/Key 覆盖", "danger", clearOpenaiOverrides);
      clrBtn.id = "clearOvBtn";
      row.appendChild(clrBtn);
    }
    row.appendChild(mkBtn("💾 保存并生效", "", e => saveSection(sec, el)));
    host.appendChild(el);
    el.appendChild(row);
  }
}

function mkBtn(text, cls, onclick) {
  const b = document.createElement("button");
  b.className = "act " + cls; b.textContent = text; b.addEventListener("click", onclick);
  return b;
}

function fieldPathEl(path) { return document.querySelector(`[data-path="${path}"]`); }

function renderField(f) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const tagHtml = f.overridden ? '<span class="tag override">已覆盖</span>' : "";
  let input;
  if (f.type === "secret") {
    input = `<input data-path="${f.path}" data-type="secret" type="password" autocomplete="new-password"
      placeholder="${f.value.set ? "已配置 " + f.value.masked + "（留空=不修改）" : "未配置"}">`;
  } else if (f.type === "select") {
    const opts = (f.options || [])
      .map(o => `<option value="${esc(o.value)}"${o.value === f.value ? " selected" : ""}>${esc(o.label || o.value)}</option>`)
      .join("");
    input = `<select data-path="${f.path}" data-type="select">${opts}</select>`;
  } else {
    input = `<input data-path="${f.path}" data-type="${f.type}" type="text"
      value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder || "")}">`;
  }
  wrap.innerHTML = `<label>${esc(f.label)}${tagHtml}</label>${input}
    ${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}`;
  if (f.type === "secret" && f.overridden) {
    const clr = mkBtn("清除覆盖", "danger", async () => {
      try {
        await api("/api/admin/config", { method: "PUT", body: JSON.stringify({ patch: pathToPatch(f.path, null) }) });
        toast("已清除覆盖，回落底层值"); refreshConfigSchema();
      } catch (e) { toast("失败：" + e.message); }
    });
    clr.style.marginTop = "6px";
    wrap.appendChild(clr);
  }
  return wrap;
}

function pathToPatch(path, value) {
  const parts = path.split(".");
  const root = {}; let node = root;
  parts.forEach((p, i) => { if (i === parts.length - 1) node[p] = value; else node = node[p] = {}; });
  return root;
}

function collectSection(sec) {
  const patch = {};
  let changed = false;
  for (const f of sec.fields) {
    const el = fieldPathEl(f.path);
    if (!el) continue;
    if (f.type === "secret") {
      if (el.value.trim() !== "") { Object.assign(patch, pathToPatch(f.path, el.value.trim())); changed = true; }
    } else if (el.value !== String(f.value ?? "")) {
      Object.assign(patch, pathToPatch(f.path, el.value.trim())); changed = true;
    }
  }
  return changed ? patch : null;
}

async function saveSection(sec, el) {
  const patch = collectSection(sec);
  if (!patch) return toast("没有修改需要保存");
  try {
    const d = await api("/api/admin/config", { method: "PUT", body: JSON.stringify({ patch }) });
    toast("✅ 已生效（" + (d.applied.join(", ") || "无变更") + "），下一次对话即用新配置");
    refreshConfigSchema(); refreshOverview();
  } catch (e) { toast("保存失败：" + e.message, 4000); }
}

async function clearOpenaiOverrides() {
  if (!confirm("清除地址/规格/模型/API Key 的面板覆盖？\n\n将回落到 config.py / 环境变量注入的原始值（.env 的 DEEPSEEK_API_KEY 等）。\n预设列表不受影响。")) return;
  const btn = $("#clearOvBtn"); btn.disabled = true;
  try {
    const d = await api("/api/admin/presets/clear-overrides", { method: "POST" });
    toast(d.cleared.length ? "✅ 已清除 " + d.cleared.length + " 项覆盖，回落底层原始值" : "本来就没有覆盖，无需清除");
    refreshOverview(); refreshPresets();
  } catch (e) { toast("清除失败：" + e.message, 4000); }
  finally { btn.disabled = false; }
}

$("#lvlApply").addEventListener("click", async () => {
  try {
    await api("/api/admin/logs/level", { method: "POST", body: JSON.stringify({ level: $("#lvl").value }) });
    toast("日志级别已切换为 " + $("#lvl").value);
    refreshOverview();
  } catch (e) { toast("失败：" + e.message); }
});

/* ---------------- AI 后端预设：一键切换 ---------------- */
let presets = [];          // 掩码视图（列表展示用）
let lastOverview = null;   // overview 快照：预设「生效中」高亮的数据源
let presetEditingId = null; // null = 新增模式
let benchResults = {};      // presetId -> 测速结果

const STYLE_LABEL = {
  chat_completions: "Chat Completions",
  openai_responses: "Responses",
  anthropic_messages: "Anthropic",
};

async function refreshPresets() {
  try {
    const d = await api("/api/admin/presets");
    presets = d.presets || [];
    renderPresetBar();
  } catch (e) { /* 令牌问题由 refreshConfigSchema 统一处理 */ }
}


function renderPresetBar() {
  const list = $("#presetList");
  if (!list) return;                  // renderSettings 未跑（首次加载竞态）
  const eff = effectiveOpenai();
  // 记住勾选状态：切换/测速都会整体重绘，若不还原，用户勾的候选会被悄悄清空
  const prevSel = {};
  list.querySelectorAll(".pitem.sel").forEach(e => { prevSel[e.dataset.id] = true; });
  list.innerHTML = "";

  if (!presets.length) {
    const empty = document.createElement("span");
    empty.className = "pempty";
    empty.textContent = "暂无预设 —— 点「＋ 空白模板」建一个，或用「＋ 复制当前表单」把下方填好的值存成按钮。";
    list.appendChild(empty);
  }

  for (const p of presets) {
    // 用「预设值 vs 当前表单值」判定生效中。表单在编辑态会先于保存到 DOM 反映用户改动，
    // 因此编辑中途不会被误标为「已生效」；api_style 缺省按 chat_completions 归一。
    const isActive = Boolean(p.base_url) && p.base_url === eff.base_url
      && p.model === eff.model
      && (p.api_style || "chat_completions") === eff.api_style;
    const item = document.createElement("span");
    item.className = "pitem" + (isActive ? " active" : "");
    item.dataset.id = p.id;
    item.title = `${p.name}\n${p.base_url}\n${p.model || "未填模型"} · ${STYLE_LABEL[p.api_style] || p.api_style}\n点击切换到此外端`;

    const bm = benchResults[p.id];
    const bmHtml = bm
      ? `<span class="bm${bm.ok ? "" : " bad"}">${bm.ok ? bm.avg_ms + "ms" : "失败"}</span>`
      : "";
    item.innerHTML = `<input type="checkbox" class="psel" data-act="sel" title="勾选参与测速">
      ${bmHtml}<span class="nm">${esc(p.name)}</span>
      <span class="mdl">${esc(p.model || "未填模型")} · ${esc(STYLE_LABEL[p.api_style] || p.api_style)}</span>
      <span class="x" data-act="copy" title="复制此预设（连同已存 Key，生成一个新按钮）">⧉</span>
      <span class="x" data-act="edit" title="编辑">✎</span>
      <span class="x" data-act="del" title="删除">×</span>`;

    item.addEventListener("click", e => {
      const act = e.target.dataset ? e.target.dataset.act : null;
      if (act === "sel") return;                                  // 勾选不触发切换
      if (act === "del") { deletePreset(p); e.stopPropagation(); return; }
      if (act === "edit") { openPresetDlg(p, true); e.stopPropagation(); return; }
      if (act === "copy") { copyPreset(p); e.stopPropagation(); return; }
      switchPreset(p, item);
    });
    // 勾选态：回写到 .pitem 自身的 class，供「仅勾选」测速读取
    const cb = item.querySelector(".psel");
    if (cb) {
      if (prevSel[p.id]) { cb.checked = true; item.classList.add("sel"); }
      cb.addEventListener("change", () => item.classList.toggle("sel", cb.checked));
    }
    list.appendChild(item);
  }
  renderBenchTable();
}

/* 当前表单值：用于判断哪个预设处于「生效中」。
   表单未渲染时（如切到日志页）回落到覆盖层之下的生效配置，避免误判。 */
function effectiveOpenai() {
  const o = lastOverview?.backends?.openai || {};
  return {
    base_url: String(o.base_url ?? "").trim(),
    api_style: String(o.api_style ?? "chat_completions").trim() || "chat_completions",
    model: String(o.model ?? "").trim(),
  };
}

async function switchPreset(p, itemEl) {
  if (itemEl) itemEl.classList.add("disabled");
  try {
    const d = await api(`/api/admin/presets/${encodeURIComponent(p.id)}/switch`, { method: "POST" });
    toast(`✅ 已切换到「${p.name}」（${d.applied.join(", ")}），下一次对话即用新配置`);
    await refreshConfigSchema();
    refreshOverview();
  } catch (e) { toast("切换失败：" + e.message, 4000); }
  finally { if (itemEl) itemEl.classList.remove("disabled"); }
}

async function deletePreset(p) {
  if (!confirm(`删除预设「${p.name}」？\n\n只删除按钮本身，不会影响当前生效配置。`)) return;
  try {
    await api(`/api/admin/presets/${encodeURIComponent(p.id)}`, { method: "DELETE" });
    delete benchResults[p.id];
    toast("已删除预设 " + p.name);
    await refreshPresets();
  } catch (e) { toast("删除失败：" + e.message, 4000); }
}

/* ---------------- 预设编辑弹窗 ---------------- */
function openPresetDlg(preset, editing) {
  const isEdit = editing === true || Boolean(preset && preset.id);
  presetEditingId = isEdit ? preset.id : null;
  $("#presetDlgTitle").textContent = isEdit ? "编辑预设" : "新增预设";
  $("#pf_name").value = preset ? preset.name : "";
  $("#pf_base_url").value = preset ? preset.base_url : "";
  $("#pf_api_style").value = preset ? preset.api_style : "chat_completions";
  $("#pf_model").value = preset ? preset.model : "";
  $("#pf_api_key").value = "";
  if (isEdit) {
    // 编辑：Key 为掩码视图，无法回传明文；留空 = 保持已保存的原值
    const key = preset.api_key;
    if (key && key.set) $("#pf_api_key").placeholder = `已保存 ${key.masked}（留空=保持不变）`;
    else $("#pf_api_key").placeholder = "未配置（留空=无鉴权）";
  } else {
    $("#pf_api_key").placeholder = "sk-...（本地无鉴权服务可留空）";
  }
  $("#presetDlg").showModal();
}

/* 从当前表单值生成一个预设草稿（复制现有按钮 / 当前表单 两种来源） */
async function copyPreset(p) {
  const newName = prompt(`复制预设「${p.name}」

新按钮名称（已存 API Key 会一并复制）：`, p.name + " 副本");
  if (newName === null) return;                       // 用户取消
  try {
    await api("/api/admin/presets", {
      method: "POST",
      body: JSON.stringify({ copy_from: p.id, name: newName.trim() || p.name + " 副本" }),
    });
    toast("✅ 已复制为「" + (newName.trim() || p.name + " 副本") + "」");
    await refreshPresets();
  } catch (e) { toast("复制失败：" + e.message, 4000); }
}

async function savePresetFromDlg() {
  const payload = {
    name: $("#pf_name").value.trim() || $("#pf_base_url").value.trim() || "未命名预设",
    base_url: $("#pf_base_url").value.trim(),
    api_style: $("#pf_api_style").value,
    model: $("#pf_model").value.trim(),
  };
  const key = $("#pf_api_key").value;
  if (key) payload.api_key = key;               // 留空 = 保持原值（编辑）/ 无鉴权（新增）
  if (!payload.base_url) return toast("请填写接口地址 Base URL");

  try {
    if (presetEditingId) {
      await api(`/api/admin/presets/${encodeURIComponent(presetEditingId)}`,
        { method: "PUT", body: JSON.stringify(payload) });
      toast("✅ 预设已更新");
    } else {
      await api("/api/admin/presets", { method: "POST", body: JSON.stringify(payload) });
      toast("✅ 预设已新增");
    }
    $("#presetDlg").close();
    await refreshPresets();
  } catch (e) { toast("保存失败：" + e.message, 4000); }
}

async function testPresetFromDlg() {
  const base_url = $("#pf_base_url").value.trim();
  if (!base_url) return toast("请填写接口地址 Base URL");
  try {
    const d = await api("/api/admin/config/test", {
      method: "POST",
      body: JSON.stringify({
        backend: "openai", base_url, model: $("#pf_model").value.trim(),
        style: $("#pf_api_style").value, api_key: $("#pf_api_key").value,
      }),
    });
    if (d.ok) toast(`✅ 连通正常：${d.via} HTTP ${d.status} · ${d.latency_ms}ms`);
    else toast(`❌ 不通：${d.first_attempt_error || ""} ${d.error || "HTTP " + d.status}`, 5000);
  } catch (e) { toast("测试失败：" + e.message, 4000); }
}

/* ---------------- 测速 ---------------- */
function benchTargetIds() {
  const scope = $("#benchScope") ? $("#benchScope").value : "all";
  if (scope !== "selected") return null;   // null = 服务端默认（全部预设）
  const picked = [...document.querySelectorAll("#presetList .pitem.sel")].map(e => e.dataset.id);
  if (!picked.length) { toast("请先勾选要测速的预设（点击名称前的方框）"); return []; }
  return picked;
}

async function runBenchmark() {
  const ids = benchTargetIds();
  if (ids && !ids.length) return;               // 已 toast 提示
  const btn = $("#benchBtn");
  btn.disabled = true; btn.textContent = "测速中…";
  $("#presetList").querySelectorAll(".pitem").forEach(e => e.classList.add("disabled"));
  try {
    const body = {
      rounds: parseInt($("#benchRounds").value, 10),
      max_tokens: parseInt($("#benchTokens").value, 10) || 300,
      prompt: $("#benchPrompt").value.trim(),
    };
    if (ids) body.ids = ids;
    const d = await api("/api/admin/presets/benchmark", { method: "POST", body: JSON.stringify(body) });
    benchResults = {};
    for (const r of d.results) benchResults[r.id] = r;
    const best = d.results.find(r => r.ok);
    toast(best ? `测速完成，最快：${best.name}（${best.avg_ms}ms）` : "测速完成：全部失败", 4000);
  } catch (e) { toast("测速失败：" + e.message, 4000); }
  finally {
    btn.disabled = false; btn.textContent = "⚡ 全部测速";
    renderPresetBar();
  }
}

function renderBenchTable() {
  const wrap = $("#benchWrap");
  if (!wrap) return;
  const rows = Object.values(benchResults);
  if (!rows.length) { wrap.innerHTML = ""; return; }
  const bestOk = rows.filter(r => r.ok).sort((a, b) => a.avg_ms - b.avg_ms)[0];
  const body = rows.map(r => {
    const tok = r.tokens != null ? r.tokens : "—";
    const tps = (r.ok && r.tokens && r.avg_ms) ? (r.tokens / (r.avg_ms / 1000)).toFixed(1) : "—";
    const cls = [r.ok ? "" : "bad", bestOk && r.id === bestOk.id ? "best" : ""].join(" ");
    return `<tr class="${cls}">
      <td>${esc(r.name)}</td>
      <td>${esc(r.model || "-")}</td>
      <td class="num">${r.ok ? r.avg_ms + " ms" : "失败"}</td>
      <td class="num">${r.ok ? r.min_ms + " ms" : "—"}</td>
      <td class="num">${tok}</td>
      <td class="num">${tps === "—" ? "—" : tps + " tok/s"}</td>
      <td>${r.ok ? (r.ok_rounds < r.rounds ? `<span class="pv">${r.ok_rounds}/${r.rounds} 轮成功</span>` : "")
                 : `<span class="pv">${esc((r.error || "失败").slice(0, 60))}</span>`}</td>
    </tr>`;
  }).join("");
  wrap.innerHTML = `<table>
    <thead><tr><th>预设</th><th>模型</th><th class="num">平均耗时</th>
      <th class="num">最快</th><th class="num">输出</th><th class="num">生成速度</th><th>备注</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="pv" style="margin-top:6px">按平均耗时升序；生成速度 = 输出 tokens ÷ 平均耗时（上游自报 usage，缺失显示 —）。</div>`;
}

/* ---------------- 预设条 / 测速控件（事件委托：栏为动态生成） ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.id === "presetAdd") { openPresetDlg(null); return; }
  if (t.id === "benchBtn") { await runBenchmark(); return; }
  if (t.id === "pfSave") { await savePresetFromDlg(); return; }
  if (t.id === "pfCancel") { $("#presetDlg").close(); return; }
  if (t.id === "pfTest") { await testPresetFromDlg(); return; }
});
$("#presetDlg").addEventListener("close", () => { presetEditingId = null; });

/* ---------------- boot ---------------- */
refreshOverview();
refreshConfigSchema();
pollLogs();
</script>
